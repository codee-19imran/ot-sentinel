spring.application.name=ot-sentinel

# Embedded H2 database (offline / portable)
spring.datasource.url=jdbc:h2:file:./ot_sentinel_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=always

# Thymeleaf (no caching during development)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/

# JWT settings for secure local login
jwt.secret=ot-sentinel-demo-secret-key-change-me-in-production-32chars!!!
jwt.expiration=86400000

server.port=8081
logging.level.com.ot.sentinel=INFO
