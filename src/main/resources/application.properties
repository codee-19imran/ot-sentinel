spring.application.name=ot-sentinel

# ---------- Embedded H2 database (offline / portable) ----------
spring.datasource.url=jdbc:h2:file:./ot_sentinel_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# "update" keeps the ingested evidence intact across restarts - a forensics
# tool must never wipe the log table when it shuts down.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Batch inserts: the parser persists thousands of rows per upload
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# The embedded DB console exposes the raw evidence tables, so it stays off
# by default. Enable it only on a trusted, isolated machine:
#   spring.h2.console.enabled=true
#   ot-sentinel.h2-console.enabled=true
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
ot-sentinel.h2-console.enabled=false

# ---------- Thymeleaf (no caching during development) ----------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/

# ---------- Log file upload limits ----------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---------- JWT for secure local login ----------
# Override in production with JWT_SECRET / JWT_EXPIRATION environment variables.
jwt.secret=${JWT_SECRET:ot-sentinel-demo-secret-key-change-me-in-production-32chars!!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- Sign-in protection ----------
# Repeated failed sign-ins lock the account temporarily.
ot-sentinel.security.max-login-attempts=5
ot-sentinel.security.login-lockout-minutes=5

# ---------- Seeded demo accounts ----------
ot-sentinel.demo.admin-password=${OT_SENTINEL_ADMIN_PASSWORD:admin123}
ot-sentinel.demo.engineer-password=${OT_SENTINEL_ENGINEER_PASSWORD:engineer123}
# Set to false to hide the demo credentials on the login screen.
ot-sentinel.demo.show-credentials=${OT_SENTINEL_SHOW_CREDENTIALS:true}

# ---------- Anomaly detection rule thresholds ----------
ot-sentinel.rules.brute-force-threshold=5
ot-sentinel.rules.brute-force-window-minutes=60
ot-sentinel.rules.off-hours=0-5

server.port=8081
logging.level.com.ot.sentinel=INFO
